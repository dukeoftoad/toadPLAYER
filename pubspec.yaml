name: toadplayer
description: Isolated standalone Toadplayer music player (Flutter UI + Rust backend + Native Audio/USB DAC/DSP bridges)
publish_to: "none"
version: 1.2.0+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  timezone: ^0.11.2

  # State Management
  flutter_riverpod: ^3.4.2

  # Storage & Persistence (Playback queue, resume snapshot, cover cache, favorites)
  shared_preferences: ^2.5.6
  flutter_secure_storage: 10.3.4
  path_provider: ^2.1.6
  path_provider_windows: ^2.3.0
  path: ^1.9.1
  ffi: ^2.2.0
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5

  # HTTP & Crypto (Lyrics AI translation, Cast media server, cover hashing)
  http: ^1.6.0
  connectivity_plus: ^7.3.1
  crypto: ^3.0.8

  # UI Components & Player Visuals
  cached_network_image: ^4.0.6
  flutter_cache_manager: ^3.4.6
  liquid_glass_easy: 5.1.0
  cupertino_icons: ^2.0.0
  material_symbols_icons: ^4.2960.0
  volume_controller: ^3.7.1

  # Material Expressive 3 / Dynamic Color
  dynamic_color: ^2.1.0
  material_ui: ^1.9.0
  material_3_expressive: ^1.2.0
  material_color_utilities: 0.13.0

  # Permissions & File Picker (Open local audio files/folders)
  permission_handler: ^13.0.1
  file_picker: ^13.3.0

  # JSON Serialization
  json_annotation: ^4.12.0

  # Utils
  url_launcher: ^6.3.3
  device_info_plus: ^13.3.0
  share_plus: ^13.3.1
  logger: ^2.7.0

  # FFmpeg & Media (AutoMix PCM extraction, spectrograms, animated cover art)
  ffmpeg_kit_flutter_new_audio: 2.5.7
  open_filex: ^5.0.0
  video_player: ^2.14.1
  xml: ^7.1.0
  html: ^0.15.7
  synchronized: ^3.5.0

  # Audio Playback, Equalizer, Sessions & Desktop Transport Controls
  flutter_local_notifications: ^22.3.3
  audioplayers: ^6.8.1
  audio_service:
    path: third_party/audio_service
  audio_session: ^0.2.4
  app_links: ^7.2.2
  media_kit: ^1.2.6
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_macos_audio: ^1.1.4
  audio_service_platform_interface: ^0.1.3
  dbus: ^0.7.15
  smtc_windows: ^1.1.0

dependency_overrides:
  flutter_secure_storage_darwin: 0.4.3
  audioplayers_darwin:
    path: third_party/audioplayers_darwin
  audioplayers_android:
    path: third_party/audioplayers_android
  flutter_rust_bridge: 2.11.1
  ffmpeg_kit_flutter_new_audio:
    path: third_party/ffmpeg_kit_flutter_new_audio
  media_kit_libs_windows_audio:
    path: third_party/media_kit_libs_windows_audio

hooks:
  user_defines:
    sqlite3:
      source:
        android: system
        ios: system
        macos: system
        default: sqlite3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
  generate: true

  shaders:
    - assets/shaders/toadplayer_selection_mask.frag

  assets:
    - LICENSE
    - COPYING
    - NOTICE
    - assets/brand/logo/png/toadplayer-icon.png
    - assets/brand/logo/png/toadplayer-lockup-horizontal-white@1x.png
    - assets/fonts/Inter-LICENSE.txt
    - assets/fonts/GoogleSansFlex-LICENSE.txt
    - assets/licenses/usb.txt
    - assets/licenses/oboe.txt
    - assets/licenses/wavpack.txt
    - assets/licenses/flac.txt
    - assets/licenses/ffmpeg.txt
    - assets/licenses/lgpl-3.0.txt
    - assets/licenses/native_palette.txt
    - assets/licenses/native_data_jobs.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
    - family: Google Sans Flex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf
