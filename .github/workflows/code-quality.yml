name: Code quality

# Static analysis, unit tests and host-native decoder tests kept separate
# from the APK build so pushes fail fast on analyzer findings or test
# regressions without waiting for a native toolchain build.
on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - 'rust_backend/**'
      - 'android/app/src/main/cpp/**'
      - '.github/workflows/code-quality.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - 'rust_backend/**'
      - 'android/app/src/main/cpp/**'
      - '.github/workflows/code-quality.yml'
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Fetch Flutter packages
        run: flutter pub get

      - name: Analyze
        # Infos stay visible in the log but stop failing the run: the Flutter
        # SDK's material.dart -> material_ui deprecation wave floods the report
        # with mechanical import infos on main. Errors and warnings still fail
        # the build.
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test

  rust-tests:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rust_backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'

      - name: Cache Rust build and test artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_backend
          prefix-key: toadplayer-quality

      - name: Run the Rust test suite
        # The bindgen crate is a uniffi codegen tool, not shipped code.
        run: cargo test --locked --workspace --exclude toadplayer-bindgen

  native-tests:
    name: native decoder tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the host FLAC decoder tests
        run: |
          set -euo pipefail
          cmake -S android/app/src/main/cpp -B build-cpp -DTOADPLAYER_AUDIO_HOST_TESTS=ON
          cmake --build build-cpp -j "$(nproc)"

      - name: Run the host FLAC decoder tests
        run: ctest --test-dir build-cpp --output-on-failure
