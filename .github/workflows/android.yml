name: Android APK (API 37, arm64)

# The only APK build. One job, one ABI (arm64-v8a), one APK targeting
# API 37. Gradle, Rust and pub caches keep the previous ~30-minute
# monolithic build well under 10 minutes on warm runs.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  # A newer push to the same branch supersedes the in-flight build.
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build arm64 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle (cached dependencies and build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools"
          # compileSdk 37: Google publishes API 37 under the minor-versioned
          # scheme (android-37.0/37.1/37.2). Install the newest stable 37.x
          # and expose it as android-37 so AGP's platform lookup succeeds.
          if ! "$SDKM" --install "platforms;android-37" > /dev/null 2>&1; then
            "$SDKM" --install "platforms;android-37.2"
            if [ ! -d "$ANDROID_HOME/platforms/android-37" ] && [ -d "$ANDROID_HOME/platforms/android-37.2" ]; then
              cp -a "$ANDROID_HOME/platforms/android-37.2" "$ANDROID_HOME/platforms/android-37"
              echo "Exposed platforms/android-37.2 as android-37"
            fi
          fi
          "$SDKM" --install "ndk;30.0.16248370"
          # Prefer the pinned CMake; fall back to the newest available 4.x.
          if ! "$SDKM" --install "cmake;4.1.2" > /dev/null 2>&1; then
            NEWEST="$("$SDKM" --list 2>/dev/null | grep -oE 'cmake;4\.[0-9]+\.[0-9]+' | sort -uV | tail -1 | cut -d';' -f2 || true)"
            if [ -n "$NEWEST" ]; then
              echo "Pinned cmake;4.1.2 unavailable, using $NEWEST"
              echo "TOADPLAYER_CMAKE_VERSION=$NEWEST" >> "$GITHUB_ENV"
              "$SDKM" --install "cmake;$NEWEST"
            else
              echo "::error::No cmake 4.x available from sdkmanager"
              exit 1
            fi
          fi

      - name: Set up Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust backend build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_backend
          prefix-key: toadplayer-android
          cache-on-failure: true

      - name: Install native build dependencies (if missing)
        run: |
          set -euo pipefail
          if ! command -v ninja > /dev/null 2>&1 || ! dpkg -s libclang-dev > /dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libclang-dev ninja-build
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Fetch Flutter packages
        run: flutter pub get

      - name: Prepare release signing (optional, from repo secrets)
        env:
          TOADPLAYER_KEYSTORE_BASE64: ${{ secrets.TOADPLAYER_KEYSTORE_BASE64 }}
          TOADPLAYER_KEYSTORE_PASSWORD: ${{ secrets.TOADPLAYER_KEYSTORE_PASSWORD }}
          TOADPLAYER_KEY_ALIAS: ${{ secrets.TOADPLAYER_KEY_ALIAS }}
          TOADPLAYER_KEY_PASSWORD: ${{ secrets.TOADPLAYER_KEY_PASSWORD }}
        if: env.TOADPLAYER_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          echo "${TOADPLAYER_KEYSTORE_BASE64}" | base64 -d > android/app/release-key.jks
          cat > android/key.properties <<KEYPROPS
          storeFile=release-key.jks
          storePassword=${TOADPLAYER_KEYSTORE_PASSWORD}
          keyAlias=${TOADPLAYER_KEY_ALIAS}
          keyPassword=${TOADPLAYER_KEY_PASSWORD}
          KEYPROPS
          echo "Release keystore materialised; APK will be release-signed."

      - name: Build arm64 release APK (target API 37)
        env:
          # One ABI, one APK: skip the armeabi-v7a slice and the universal
          # APK that doubled the native build and packaging time.
          TOADPLAYER_RUST_ANDROID_ABIS: arm64-v8a
          TOADPLAYER_UNIVERSAL_APK: 'false'
          # --split-per-abi is required for the Flutter CLI to discover split
          # APK outputs; without it the tool expects a universal app-release.apk
          # and reports "failed to produce an .apk file" even though Gradle
          # produced app-arm64-v8a-release.apk.
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --dart-define=TOADPLAYER_BUILD_NUMBER=$GITHUB_RUN_NUMBER

      - name: Collect APK
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            v*) VERSION="${GITHUB_REF_NAME#v}" ;;
            # CI-run-numbered alphas match the versionCode the Gradle build
            # stamps (GITHUB_RUN_NUMBER), so installs sort identically.
            *)  VERSION="alpha-r${GITHUB_RUN_NUMBER}-$(git rev-parse --short=8 HEAD)" ;;
          esac
          mkdir -p dist
          apk_count=0
          for f in build/app/outputs/apk/release/*.apk; do
            apk_count=$((apk_count + 1))
            base="$(basename "$f")"
            case "$base" in
              *arm64*)  cp "$f" "dist/toadplayer-${VERSION}-arm64-v8a.apk" ;;
              *)        cp "$f" "dist/toadplayer-${VERSION}-${base}" ;;
            esac
          done
          if [ "$apk_count" -ne 1 ]; then
            echo "::error::Expected exactly 1 APK, got $apk_count"
            exit 1
          fi
          ls -la dist
          {
            echo "## Build result"
            echo ""
            echo "| APK | Size |"
            echo "| --- | --- |"
            for f in dist/*.apk; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: toadplayer-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            Toadplayer **${{ github.ref_name }}** release build for Android (arm64-v8a, target API 37).

            - `toadplayer-*-arm64-v8a.apk` — one build for modern 64-bit devices

            **What's new in v1.2.0**

            - Zen view on every theme: double-tap the cover art to hide all
              player UI — the cover gestures and zen view now work on
              Material layouts too, not just Glass — with a blackout
              screen style available for the double-tap gesture.
            - Tap the cover for lyrics: a single tap opens the lyrics view,
              with real fullscreen lyrics support.
            - Cover-only swipe: track-switch swiping is confined to the
              cover art area, so it no longer collides with page swipes;
              pinch support is arena-free.
            - Anti-pop playback: a live volume ride on track transitions
              removes the pop/crackle when switching songs, and the
              session holds still on lyrics-only saves.
            - Lyrics overhaul: online lyrics search is real with a
              verify-first flow, .lrc file import, deleting embedded
              lyrics, hardened translation, and synced lyric offset.
            - Expanded sleep mode alongside the new cover gestures and
              transitions.
            - English-only UI: the Hindi locale is dropped.
            - Brand refresh: the share card, About screen and Android TV
              banner carry the toad icon.

            **v1.0.1** shipped the shared sleep timer, lyrics-settings
            delivery to the backend and log-noise fixes; **v1.0.0** fixed
            the Rust-backend init race, SAF playback failures, FTS5
            transaction corruption and added the custom sleep timer,
            playback speed control and A–B repeat.

            Sideloading: download the APK, allow "Install unknown apps" for your
            browser/file manager, then install. Without release-keystore secrets
            this build is debug-signed, so updating over a differently-signed
            build requires uninstalling first.
