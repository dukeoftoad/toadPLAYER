name: Android Kotlin compile

# Compile the actual Android release Kotlin source set independently of the
# APK packaging job. This catches Kotlin/Android integration regressions in PRs.
on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'rust_backend/**'
      - 'scripts/build_rust_backend.sh'
      - 'third_party/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-kotlin.yml'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'rust_backend/**'
      - 'scripts/build_rust_backend.sh'
      - 'third_party/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-kotlin.yml'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-kotlin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile Android release Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.8.2 (cached distribution, dependencies and build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
          cache-disabled: false

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools"

          # compileSdk 37 is published as minor-versioned platforms; expose
          # the newest stable 37.x under the android-37 directory AGP expects.
          if ! "$SDKM" --install "platforms;android-37" > /dev/null 2>&1; then
            "$SDKM" --install "platforms;android-37.2"
            if [ ! -d "$ANDROID_HOME/platforms/android-37" ] && [ -d "$ANDROID_HOME/platforms/android-37.2" ]; then
              cp -a "$ANDROID_HOME/platforms/android-37.2" "$ANDROID_HOME/platforms/android-37"
              echo "Exposed platforms/android-37.2 as android-37"
            fi
          fi

          "$SDKM" --install "ndk;30.0.16248370"

          # Keep Gradle's configured CMake version available even though this
          # job stops before native packaging.
          if ! "$SDKM" --install "cmake;4.1.2" > /dev/null 2>&1; then
            NEWEST="$("$SDKM" --list 2>/dev/null | grep -oE 'cmake;4\.[0-9]+\.[0-9]+' | sort -uV | tail -1 | cut -d';' -f2 || true)"
            if [ -n "$NEWEST" ]; then
              echo "Pinned cmake;4.1.2 unavailable, using $NEWEST"
              echo "TOADPLAYER_CMAKE_VERSION=$NEWEST" >> "$GITHUB_ENV"
              "$SDKM" --install "cmake;$NEWEST"
            else
              echo "::error::No cmake 4.x available from sdkmanager"
              exit 1
            fi
          fi

      - name: Set up Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android

      - name: Cache Rust backend build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_backend
          prefix-key: toadplayer-kotlin
          cache-on-failure: true

      - name: Install native build dependencies (if missing)
        run: |
          set -euo pipefail
          if ! command -v ninja > /dev/null 2>&1 || ! dpkg -s libclang-dev > /dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libclang-dev ninja-build
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Fetch Flutter packages
        run: flutter pub get

      - name: Configure Android local.properties
        run: |
          set -euo pipefail
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "flutter.sdk=$FLUTTER_ROOT"
          } > android/local.properties

      - name: Compile Android release Kotlin
        working-directory: android
        env:
          TOADPLAYER_RUST_ANDROID_ABIS: arm64-v8a
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          gradle --version
          gradle --no-daemon :app:buildRustBackend :app:compileReleaseKotlin
